{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Login de Usuario </title>
    <link rel="stylesheet" href="{% static 'restaurantes/login.css' %}">
</head>


<body>

    <div class="login-container">
    <h1>Login ao Sistema</h1>

    <img src="{% static 'restaurantes/logoNoPonto.png' %}" alt="NoPonto!">

    <form action="" method="POST">
        {% csrf_token %}

        {% if erro %}
            <p>{{ erro }}</p>
        {% endif %}

        <div class="form-group">
            <label for="username">Usuário:</label>
            <input type="text" id="username" name="username" required placeholder="Digite seu usuário">
        </div>


        <div class="form-group">
            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" required placeholder="Digite sua senha">
        </div>
        <button type="submit" class="btn-submit">Entrar</button>

    </form>

    <a href="{% url 'cadastro' %}">Criar conta</a>

    </div>

</body>

</html>
