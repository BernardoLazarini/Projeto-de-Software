<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — noPonto</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">
        <h1>Login ao Sistema</h1>

        <img src="../logoNoPonto.png" alt="noPonto">

        <form action="" method="POST">

            <div class="form-group">
                <label for="username">Usuário ou E-mail:</label>
                <input type="text" id="username" name="username" required placeholder="Digite seu usuário">
            </div>

            <div class="form-group">
                <label for="password">Senha:</label>
                <input type="password" id="password" name="password" required placeholder="Digite sua senha">
            </div>

            <button type="submit" class="btn-submit">Entrar</button>

        </form>

        <!-- TODO: trocar "#" pela página de recuperação de senha quando ela existir. -->

        <p class="login-links">
            Não tem conta? <a href="../Cadastro/cadastro.html">Criar conta</a>
        </p>

    </div>

</body>

</html>
