<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — noPonto</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">
        <h1>Login ao Sistema</h1>

        <img src="../logoNoPonto.png" alt="noPonto">

        <form id="loginForm" novalidate>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required placeholder="seunome@aluno.puc-rio.br" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Senha:</label>
                <input type="password" id="password" name="password" required placeholder="Digite sua senha" autocomplete="current-password">
            </div>

            <p id="loginErro" role="alert" style="display:none; color:#B3261E; font-size:14px; margin:0 0 12px;"></p>

            <button type="submit" class="btn-submit" id="btnEntrar">Entrar</button>

        </form>

        <!-- TODO: trocar "#" pela página de recuperação de senha quando ela existir. -->
        <p class="login-links">
            <a href="#">Esqueci minha senha</a>
        </p>

        <p class="login-links">
            Não tem conta? <a href="../Cadastro/cadastro.html">Criar conta</a>
        </p>

    </div>

<script>
/* noPonto — login. Chama a API do backend (POST /api/login); a sessão fica em cookie HttpOnly. */
(function () {
  'use strict';

  // TODO: trocar pelo destino definitivo (página inicial) quando ela existir.
  var DESTINO_APOS_LOGIN = '../EditarPerfil/editarperfil.html';

  var form = document.getElementById('loginForm');
  var email = document.getElementById('email');
  var senha = document.getElementById('password');
  var erro = document.getElementById('loginErro');
  var botao = document.getElementById('btnEntrar');

  function mostrarErro(mensagem) {
    erro.textContent = mensagem;
    erro.style.display = 'block';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    erro.style.display = 'none';

    if (!email.value.trim() || !senha.value) {
      mostrarErro('Preencha o e-mail e a senha.');
      return;
    }

    botao.disabled = true;
    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email.value.trim(), senha: senha.value })
    })
      .then(function (resp) {
        return resp.json().catch(function () { return {}; }).then(function (corpo) {
          return { ok: resp.ok, corpo: corpo };
        });
      })
      .then(function (res) {
        if (res.ok) {
          window.location.href = DESTINO_APOS_LOGIN;
          return;
        }
        mostrarErro(res.corpo.erro || 'Não foi possível entrar. Tente novamente.');
      })
      .catch(function () {
        mostrarErro('Não foi possível conectar ao servidor. Verifique se ele está rodando.');
      })
      .then(function () { botao.disabled = false; });
  });
})();
</script>
</body>

</html>
